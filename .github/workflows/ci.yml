name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Test Suite & PostgreSQL Integration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: analytixflow
          POSTGRES_PASSWORD: change-me-local-only
          POSTGRES_DB: analytixflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ANALYTIXFLOW_TEST_DATABASE_URL: postgresql+psycopg://analytixflow:change-me-local-only@localhost:5432/analytixflow_test
      ANALYTIXFLOW_CONCURRENCY_DATABASE_URL: postgresql+psycopg://analytixflow:change-me-local-only@localhost:5432/analytixflow_concurrency_test
      PYTHONPATH: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Create concurrency test database
        run: |
          if command -v psql >/dev/null 2>&1; then
            PGPASSWORD=change-me-local-only psql -h localhost -U analytixflow -d analytixflow_test -c "CREATE DATABASE analytixflow_concurrency_test;"
          else
            python -c "import psycopg; conn = psycopg.connect('postgresql://analytixflow:change-me-local-only@localhost:5432/analytixflow_test', autocommit=True); conn.execute('CREATE DATABASE analytixflow_concurrency_test'); conn.close()"
          fi

      - name: Run Alembic migrations
        run: |
          DATABASE_URL="$ANALYTIXFLOW_TEST_DATABASE_URL" alembic -c backend/alembic.ini upgrade head
          DATABASE_URL="$ANALYTIXFLOW_CONCURRENCY_DATABASE_URL" alembic -c backend/alembic.ini upgrade head

      - name: Execute Pytest Suite with JUnit XML reporting
        run: |
          python -m pytest backend/tests/ -v -ra --durations=10 --junitxml=/tmp/pytest-results.xml

      - name: Verify Zero-Skip Guarantee and Test Counts
        if: always()
        run: |
          python - << 'EOF'
          import os
          import sys
          import xml.etree.ElementTree as ET

          xml_path = "/tmp/pytest-results.xml"
          if not os.path.exists(xml_path):
              print(f"FATAL: Test results XML not found at {xml_path}. Pytest did not run or crashed.", file=sys.stderr)
              sys.exit(1)

          try:
              tree = ET.parse(xml_path)
          except Exception as exc:
              print(f"FATAL: Unable to parse {xml_path}: {exc}", file=sys.stderr)
              sys.exit(1)

          root = tree.getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          if suite is None:
              print("FATAL: No <testsuite> element found in XML report", file=sys.stderr)
              sys.exit(1)

          total_tests = int(suite.attrib.get("tests", 0))
          failures = int(suite.attrib.get("failures", 0))
          errors = int(suite.attrib.get("errors", 0))
          skipped = int(suite.attrib.get("skipped", 0))
          passed = total_tests - (failures + errors + skipped)

          print("=" * 60)
          print("           PYTEST EXECUTION AUDIT & CERTIFICATION           ")
          print("=" * 60)
          print(f"Total collected & executed: {total_tests}")
          print(f"Passed:                     {passed}")
          print(f"Skipped:                    {skipped}")
          print(f"Failures:                   {failures}")
          print(f"Errors:                     {errors}")
          print("=" * 60)

          EXPECTED_TOTAL = 138
          EXPECTED_POSTGRES = 24

          postgres_modules = {
              "test_concurrency",
              "test_project_scoped_integrity_postgres",
              "test_m3_preparation_postgres",
              "test_m4_modeling_postgres",
              "test_m5_evaluation_postgres",
              "test_m6_deployment_postgres",
              "test_m7_governance_postgres",
              "test_m8_dashboard_postgres",
              "test_m9_end_to_end_postgres",
          }

          executed_postgres_tests = []
          for tc in suite.findall("testcase"):
              classname = tc.attrib.get("classname", "")
              if any(mod in classname for mod in postgres_modules):
                  executed_postgres_tests.append(f"{classname}.{tc.attrib.get('name')}")

          print(f"Identified PostgreSQL integration tests: {len(executed_postgres_tests)} (expected: {EXPECTED_POSTGRES})")
          for t in executed_postgres_tests:
              print(f"  [OK] {t}")
          print("=" * 60)

          errors_detected = False

          if skipped > 0:
              print("\nERROR: Zero-Skip Guarantee VIOLATED! The following tests were skipped:", file=sys.stderr)
              for tc in suite.findall("testcase"):
                  sk = tc.find("skipped")
                  if sk is not None:
                      msg = sk.attrib.get("message", sk.text or "no message")
                      print(f"  - {tc.attrib.get('classname')}.{tc.attrib.get('name')}: {msg}", file=sys.stderr)
              errors_detected = True

          if failures > 0 or errors > 0:
              print(f"\nERROR: Test execution reported {failures} failure(s) and {errors} error(s).", file=sys.stderr)
              errors_detected = True

          if total_tests != EXPECTED_TOTAL:
              print(f"\nERROR: Expected {EXPECTED_TOTAL} total tests, but executed {total_tests}.", file=sys.stderr)
              errors_detected = True

          if len(executed_postgres_tests) != EXPECTED_POSTGRES:
              print(f"\nERROR: Expected {EXPECTED_POSTGRES} PostgreSQL tests, but found {len(executed_postgres_tests)}.", file=sys.stderr)
              errors_detected = True

          if errors_detected:
              print("\nAUDIT FAILED: Requirements not met.", file=sys.stderr)
              sys.exit(1)

          print("\nAUDIT PASSED: All 138 tests passed with 0 skipped, 0 failures, and 0 errors.")
          print("Zero-Skip Guarantee verified: all 24 PostgreSQL integration tests executed successfully.")
          EOF

      - name: Cleanup temporary test artifacts
        if: always()
        run: |
          rm -f /tmp/pytest-results.xml
